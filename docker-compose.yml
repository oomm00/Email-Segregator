x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-shared-env: &shared-env
  DATABASE_URL: postgresql+asyncpg://shipping:shipping_secret@postgres:5432/shipping_email
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://shipping:shipping_secret@rabbitmq:5672//
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  ELASTICSEARCH_HOSTS: http://elasticsearch:9200
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: shipping_access
  MINIO_SECRET_KEY: shipping_secret
  MINIO_BUCKET: shipping-attachments
  MINIO_SECURE: "false"
  APP_ENV: development
  APP_DEBUG: "true"
  LOG_LEVEL: INFO
  SECRET_KEY: dev-secret-key-change-in-production
  JWT_SECRET_KEY: dev-jwt-secret-change-in-production
  CORS_ORIGINS: "*"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shipping_email
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping_email"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: shipping
      RABBITMQ_DEFAULT_PASS: shipping_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    logging: *default-logging

  elasticsearch:
    image: elasticsearch:8.11.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shipping_access
      MINIO_ROOT_PASSWORD: shipping_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  migrate:
    build:
      context: .
      target: api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *shared-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    profiles:
      - migrate

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    environment:
      <<: *shared-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *shared-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  esdata:
  miniodata:
